{{- if .Values.networkPolicy.enabled }}
# Only the ingress namespace may reach the pods; pods may reach DNS, PostgreSQL, the OTel collector and HTTPS
# (IdP JWKS, model providers). Add rules under networkPolicy.extraEgress for Redis, Kafka, SMTP, etc.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "intent-oms.fullname" . }}
  labels:
    {{- include "intent-oms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "intent-oms.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 5432, protocol: TCP }
        - { port: 4318, protocol: TCP }
        - { port: 443, protocol: TCP }
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
