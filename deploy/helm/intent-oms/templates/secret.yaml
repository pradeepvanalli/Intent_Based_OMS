{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intent-oms.fullname" . }}
  labels:
    {{- include "intent-oms.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  OMS_DB_URL: {{ printf "jdbc:postgresql://%s:5432/%s" (include "intent-oms.postgresql.fullname" .) .Values.postgresql.database | quote }}
  OMS_DB_USER: {{ .Values.postgresql.username | quote }}
  {{- if not .Values.postgresql.existingSecret }}
  OMS_DB_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- end }}
  OMS_JWT_SECRET: {{ include "intent-oms.secretValue" (list . "OMS_JWT_SECRET" 48) | quote }}
  OMS_MASTER_KEY: {{ include "intent-oms.secretValue" (list . "OMS_MASTER_KEY" 32) | quote }}
  {{- range $k, $v := .Values.secrets.values }}
  {{- if and (ne $v "") (not (has $k (list "OMS_JWT_SECRET" "OMS_MASTER_KEY"))) }}
  {{- if not (and $.Values.postgresql.enabled (has $k (list "OMS_DB_URL" "OMS_DB_USER" "OMS_DB_PASSWORD"))) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intent-oms.postgresql.fullname" . }}
  labels:
    {{- include "intent-oms.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
{{- end }}
