# Production profile (spring.profiles.active=prod). Safe defaults; everything secret comes from the environment or
# mounted files and has NO fallback here, so a missing value fails fast (see ai.intentoms.app.ProductionReadinessCheck
# and backend/oms-platform/HARDENING.md). Values not listed inherit from application.yml.
server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the ingress / load balancer
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    enabled: ${OMS_SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${OMS_SWAGGER_ENABLED:false}
oms:
  security:
    jwt-secret: ${OMS_JWT_SECRET:change-me-in-production-please-32chars}   # the placeholder is rejected at startup
    jwt-secret-file: ${OMS_JWT_SECRET_FILE:}
    master-key: ${OMS_MASTER_KEY:}
    dev-users: ${OMS_DEV_USERS:}
    hsts: true
    trust-forwarded-for: true
    cors:
      allowed-origins: ${OMS_CORS_ALLOWED_ORIGINS:}
      allow-credentials: ${OMS_CORS_ALLOW_CREDENTIALS:false}
    oidc:
      issuer-uri: ${OMS_OIDC_ISSUER_URI:}
      jwk-set-uri: ${OMS_OIDC_JWK_SET_URI:}
      audience: ${OMS_OIDC_AUDIENCE:}
      tenant-claim: ${OMS_OIDC_TENANT_CLAIM:tenant}
      default-tenant: ${OMS_OIDC_DEFAULT_TENANT:}
      roles-claim: ${OMS_OIDC_ROLES_CLAIM:roles}
  demo:
    seed: false
  agent:
    demo-expose-secrets: false
logging:
  level:
    root: info
    ai.intentoms: info
    org.springframework.security: warn
