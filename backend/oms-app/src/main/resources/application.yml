spring:
  application:
    name: intent-oms
  datasource:
    url: ${OMS_DB_URL:jdbc:postgresql://localhost:5440/oms}
    username: ${OMS_DB_USER:oms}
    password: ${OMS_DB_PASSWORD:oms}
    hikari:
      maximum-pool-size: ${OMS_DB_POOL:32}
      minimum-idle: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
server:
  port: ${OMS_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: intent-oms
springdoc:
  swagger-ui:
    path: /swagger-ui
oms:
  security:
    # Local HS256 session-token secret: inline, or read from a mounted file (OMS_JWT_SECRET_FILE wins when set).
    jwt-secret: ${OMS_JWT_SECRET:change-me-in-production-please-32chars}
    jwt-secret-file: ${OMS_JWT_SECRET_FILE:}
    # AES-256 master key wrapping per-tenant PII tokenisation keys (tenant_key.key_material). Warned when empty, required in prod.
    master-key: ${OMS_MASTER_KEY:}
    # Dev-only bootstrap users (id:password:tenant:role|role). Must be empty in prod; set OMS_DEV_USERS= to disable.
    dev-users: ${OMS_DEV_USERS:admin:admin:demo:admin,ops:ops:demo:ops_analyst,cs:cs:demo:cs_rep,risk:risk:demo:risk_analyst,finance:finance:demo:finance_controller,strategy:strategy:demo:strategy_lead}
    cors:
      allowed-origins: ${OMS_CORS_ALLOWED_ORIGINS:*}   # explicit origins required in prod
    # Optional OIDC/SSO resource-server mode (NFR-07); enabled when an issuer or JWKS URI is set. See HARDENING.md.
    oidc:
      issuer-uri: ${OMS_OIDC_ISSUER_URI:}
      jwk-set-uri: ${OMS_OIDC_JWK_SET_URI:}
      audience: ${OMS_OIDC_AUDIENCE:}
      tenant-claim: ${OMS_OIDC_TENANT_CLAIM:tenant}
      default-tenant: ${OMS_OIDC_DEFAULT_TENANT:}
      roles-claim: ${OMS_OIDC_ROLES_CLAIM:roles}
  outbox:
    enabled: true
    poll-ms: 250
    batch-size: 200
    max-attempts: 12
  kafka:
    enabled: ${OMS_KAFKA_ENABLED:false}
    topic-prefix: oms.events
  decision:
    jev:
      enabled: ${JEV_ENABLED:true}
      # Direct TypeSafe key or an OpenRouter key (sk-or-...). With an OpenRouter key the base URL defaults to
      # https://openrouter.ai/api and the model to typesafe/jev-1.13; override with TYPESAFE_BASE_URL / JEV_MODEL.
      api-key: ${TYPESAFE_API_KEY:${OPENROUTER_API_KEY:}}
      base-url: ${TYPESAFE_BASE_URL:}
      model: ${JEV_MODEL:}
      timeout-ms: ${JEV_TIMEOUT_MS:800}
      latency-allowance-ms: ${JEV_LATENCY_ALLOWANCE_MS:}   # default 1200 via OpenRouter, 0 direct
      input-usd-per-million-tokens: 0.042
    llm:
      # auto = Anthropic key if present, else any OpenAI-compatible key. An OpenRouter key (sk-or-...) routes the
      # OpenAI-compatible provider to https://openrouter.ai/api/v1 with model anthropic/claude-sonnet-4.5 by default.
      provider: ${LLM_PROVIDER:auto}
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      openai-api-key: ${OPENAI_API_KEY:${OPENROUTER_API_KEY:}}
      openai-base-url: ${OPENAI_BASE_URL:}
      openai-model: ${LLM_MODEL:${OPENAI_MODEL:}}
      timeout-ms: ${LLM_TIMEOUT_MS:8000}
  copilot:
    # Prompt-based configuration, ops Q&A, explanations, CS drafts and the Margin Guardian digest. The key defaults to
    # OPENROUTER_API_KEY then OPENAI_API_KEY; an sk-or- key routes to OpenRouter with anthropic/claude-sonnet-4.5.
    enabled: ${OMS_COPILOT_ENABLED:true}
    api-key: ${OMS_COPILOT_API_KEY:${OPENROUTER_API_KEY:${OPENAI_API_KEY:}}}
    base-url: ${OMS_COPILOT_BASE_URL:}
    model: ${OMS_COPILOT_MODEL:}
    timeout-ms: ${OMS_COPILOT_TIMEOUT_MS:180000}
    max-retries: ${OMS_COPILOT_MAX_RETRIES:1}
  integrations:
    # All adapters are off by default; the deterministic mocks keep the system running without credentials.
    graphiql: ${OMS_GRAPHIQL:false}
    notify:
      enabled: ${OMS_NOTIFY_ENABLED:false}
      sendgrid:
        api-key: ${SENDGRID_API_KEY:}
        from-email: ${SENDGRID_FROM_EMAIL:}
        from-name: ${SENDGRID_FROM_NAME:Intent OMS}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from: ${TWILIO_FROM:}
    address:
      provider: ${OMS_ADDRESS_PROVIDER:mock}
      smarty:
        auth-id: ${SMARTY_AUTH_ID:}
        auth-token: ${SMARTY_AUTH_TOKEN:}
    carrier:
      provider: ${OMS_CARRIER_PROVIDER:mock}
      easypost:
        api-key: ${EASYPOST_API_KEY:}
    wms:
      provider: ${OMS_WMS_PROVIDER:mock}
    marketplace:
      amazon:
        enabled: ${AMAZON_SPAPI_ENABLED:false}
        client-id: ${AMAZON_SPAPI_CLIENT_ID:}
        client-secret: ${AMAZON_SPAPI_CLIENT_SECRET:}
        refresh-token: ${AMAZON_SPAPI_REFRESH_TOKEN:}
        marketplace-ids: ${AMAZON_SPAPI_MARKETPLACE_IDS:ATVPDKIKX0DER}
  demo:
    seed: ${OMS_DEMO_SEED:true}
    # Tenant folders under config/tenants to seed (comma list); falls back to `tenant` when empty. Folders that do not
    # exist are skipped with a warning, so the default list works before every reference tenant is present.
    tenants: ${OMS_DEMO_TENANTS:}
    tenant: ${OMS_DEMO_TENANT:demo}
  agent:
    demo-expose-secrets: ${OMS_DEMO_SEED:true}
  config-dir: ${OMS_CONFIG_DIR:../../config}
logging:
  level:
    root: info
    ai.intentoms: info
    org.springframework.security: warn
