# Lumen & Loom — order types (FR-CAP-03). Each binds a header + line state model, the workflow that drives it and the
# decision set it may invoke. `sourcing:` blocks are also written to tenant_config sourcing.order_type_constraints.
# Workflows are code (order.standard_ship, order.bopis); state models are configuration, so try_before_you_buy binds its
# own models to the standard workflow.
orderTypes:
  - name: standard_ship
    description: Ship-to-home from the DC, the 3PL or a store
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, bracketing_likelihood, sourcing_node_score, split_acceptability, sla_breach_risk, exception_classify, address_risk]
    channelDefaults:
      web: ship_as_available
      marketplace: ship_complete
      pos: ship_complete
      agent: ship_complete
      b2b: ship_complete
    returnWindowDays: 30
  - name: bopis
    description: Buy online, pick up in one of the five stores
    headerStateModel: order.bopis
    lineStateModel: order_line.bopis
    workflowType: order.bopis
    decisions: [sla_breach_risk, exception_classify]
    channelDefaults: { web: pickup_consolidated, agent: pickup_consolidated }
    returnWindowDays: 30
  - name: ship_from_store
    description: Ship-to-home fulfilled by the nearest store (same-day inside 40 km)
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, bracketing_likelihood, sourcing_node_score, sla_breach_risk, exception_classify]
    sourcing: { nodeTypes: [store], maxDistanceKm: 120 }
    returnWindowDays: 30
  - name: try_before_you_buy
    description: Authorisation hold at checkout; the card is charged for what the customer keeps after a 7-day trial
    headerStateModel: order.try_before_you_buy
    lineStateModel: order_line.try_before_you_buy
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, bracketing_likelihood, sourcing_node_score, sla_breach_risk, exception_classify, address_risk]
    channelDefaults: { web: ship_complete, agent: ship_complete }
    sourcing: { nodeTypes: [dc, 3pl] }      # trial orders ship complete from a warehouse so the trial clock starts once
    returnWindowDays: 14
  - name: exchange
    description: Replacement order for a size or colour swap, sourced from the nearest store with the new size
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [exchange_fulfilment, sourcing_node_score, sla_breach_risk, exception_classify]
    channelDefaults: { web: ship_complete, cs: ship_complete, agent: ship_complete }
    sourcing: { nodeTypes: [store, dc, 3pl] }
    returnWindowDays: 30
  - name: wholesale
    description: Boutique (B2B) order on net terms, one delivery with a packing list, no consumer returns
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [sourcing_node_score, split_acceptability, sla_breach_risk, exception_classify]
    channelDefaults: { b2b: ship_complete }
    sourcing: { nodeTypes: [dc, 3pl] }
    returnWindowDays: 0
  - name: pre_order
    description: Seasonal collection drop sold against inbound stock; oversell handled by drop_oversell_action
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, sourcing_node_score, backorder_next_action, drop_oversell_action]
    channelDefaults: { web: ship_complete, agent: ship_complete }
    sourcing: { allowBackorder: true, includeInbound: true, nodeTypes: [dc, 3pl] }
    returnWindowDays: 30
