# Lumen & Loom playbooks (FR-MON-04): configured remediation steps gated by decision confidence and spend limits.
# Actions with handlers: notify, create_task, hold, classify, log (built-in); resource, repromise, contact_customer,
# reship, refund, cancel, reauthorize, retry_workflow (orchestration). A step with no handler is recorded `skipped`.
playbooks:
  - name: resource
    description: Re-source the affected lines to the next best node and penalise the rejecting node
    steps:
      - { action: resource, minConfidence: 0.0 }
      - { action: notify, channel: slack, template: resourced }
  - name: short_pick_3pl
    description: The 3PL short-picked; re-source to the DC or a store, tell the customer if the promise moves, and open an ops task when the SKU is now short everywhere
    steps:
      - { action: resource, minConfidence: 0.0 }
      - { action: repromise, minConfidence: 0.5 }
      - { action: contact_customer, template: delay_notice, requiresDecision: sla_breach_risk, minConfidence: 0.8 }
      - { action: create_task, queue: ops_exceptions, onFailure: true }
  - name: repromise
    description: Recompute the promise and tell the customer when on-time probability drops
    steps:
      - { action: repromise, minConfidence: 0.5 }
      - { action: contact_customer, template: delay_notice, requiresDecision: sla_breach_risk, minConfidence: 0.8 }
  - name: carrier_exception
    description: A carrier exception has not cleared in two days; re-promise and let CS know
    steps:
      - { action: repromise, minConfidence: 0.5 }
      - { action: contact_customer, template: delay_notice }
      - { action: create_task, queue: cs_exceptions, when: "exception.age_minutes > 2880" }
  - name: carrier_lost
    description: Parcel confirmed lost; reship within the spend limit or open a CS task for a refund
    steps:
      - { action: reship, minConfidence: 0.0 }
      - { action: contact_customer, template: reshipped }
      - { action: create_task, queue: cs_exceptions, onFailure: true }
  - name: address_fix
    steps:
      - { action: hold, holdType: address, blocks: [release] }
      - { action: contact_customer, template: address_confirm }
      - { action: create_task, queue: cs_exceptions }
  - name: payment_retry
    steps:
      - { action: reauthorize }
      - { action: hold, holdType: payment, blocks: [release], onFailure: true }
      - { action: create_task, queue: finance_exceptions, onFailure: true }
  - name: trial_period_ended
    description: Try-before-you-buy trial is over; remind the customer, re-authorise if the hold is expiring and ask finance to capture what she kept
    steps:
      - { action: contact_customer, template: trial_ending }
      - { action: reauthorize, when: "exception.age_minutes > 1440" }
      - { action: create_task, queue: finance_exceptions }
  - name: drop_oversell
    description: A drop sold past its stock; merchandising decides per line (drop_oversell_action) and the oversold shoppers hear from us first
    steps:
      - { action: notify, channel: slack, template: drop_oversold }
      - { action: contact_customer, template: drop_backorder_notice, requiresDecision: drop_oversell_action, minConfidence: 0.8 }
      - { action: create_task, queue: merch_planning }
  - name: exchange_hold
    description: Hold a cross-ship exchange until the original garment is scanned by the carrier
    steps:
      - { action: hold, holdType: exchange_pending_return, blocks: [release] }
      - { action: contact_customer, template: exchange_hold_notice }
  - name: notify_oncall
    steps:
      - { action: notify, channel: pagerduty }
      - { action: create_task, queue: platform_oncall }
  - name: diagnose_stuck
    steps:
      - { action: classify }
      - { action: retry_workflow }
      - { action: create_task, queue: ops_exceptions, onFailure: true }
  - name: store_backlog
    description: A store is behind on picks; nudge the store, re-source after four hours
    steps:
      - { action: notify, channel: slack, template: store_backlog }
      - { action: create_task, queue: store_ops, when: "exception.age_minutes > 120" }
      - { action: resource, minConfidence: 0.8, when: "exception.age_minutes > 240" }
  - name: margin_review
    steps:
      - { action: create_task, queue: margin_floor_approvals }
  - name: agent_review
    steps:
      - { action: hold, holdType: agent_verification, blocks: [release] }
      - { action: create_task, queue: risk_review }
  - name: return_not_received
    steps:
      - { action: contact_customer, template: return_reminder }
      - { action: create_task, queue: cs_exceptions, when: "exception.age_minutes > 10080" }
  - name: pickup_reminder
    steps:
      - { action: contact_customer, template: pickup_reminder }
  - name: manual_review
    steps:
      - { action: create_task, queue: ops_exceptions }
spendLimits:
  reship_usd: 200          # a reship above this (the trench coat) goes to a CS task instead of running automatically
  refund_usd: 150
  appeasement_usd: 25
