# Backorder next action (SLA onBreach decision on `backordered` for every order type except pre_order, which uses
# drop_oversell_action). Tier T1 choice.
decision: backorder_next_action
version: 1
owner: fulfilment-ops
tier: T1
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: wait
state:
  include:
    - line.sku
    - line.days_backordered
    - line.expected_restock_days
    - line.substitute_available
    - order.channel
    - order.order_type
    - order.intent
    - customer.tier
    - network.atp_elsewhere
questions:
  next_action:
    type: choice
    instructions: What should happen to this backordered line?
    feeds: backorder_playbook
    criteria:
      wait: Restock is imminent, keep waiting and tell the customer the date
      resource: Stock exists at another node such as a store, re-source the line
      cancel_line: No restock in sight and no alternative, cancel the line and release the authorisation
      offer_substitute: The same style in another colour or an adjacent size is available to offer
      unclear: Not enough information to decide
bands:
  act: { confidence_gte: 0.8 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
