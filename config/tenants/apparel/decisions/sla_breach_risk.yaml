# SLA breach risk (FR-MON-02). Score 0–4 per open order, tier T1; feeds proactive re-promise. Store nodes with
# Saturday staffing gaps and the 3PL's reject rate are the main drivers in this network.
# v3 (CX-03): deterministic L0 rules for the clear cases, so a late order reaches the warn-early threshold without a
# model: the promise date has passed and the order is not delivered (4); a carrier exception on one of its parcels (3);
# not shipped, under a day of promise left and stuck in its state for a day or more (3); not shipped from a node whose
# learned backlog-to-breach probability is 70% or more (3). Everything else goes to the model as before.
decision: sla_breach_risk
version: 3
owner: control-tower
tier: T1
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: 1
rules:
  - id: promise_passed
    when: "has(input.order.promise_hours_remaining) && input.order.promise_hours_remaining < 0.0"
    then: 4
    reason: promise_passed_not_delivered
    priority: 10
  - id: carrier_exception
    when: "has(input.order.carrier_exception) && input.order.carrier_exception == true"
    then: 3
    reason: carrier_exception_reported
    priority: 20
  - id: unshipped_stuck_promise_due
    when: "input.order.state in ['created', 'validated', 'sourcing', 'released', 'on_hold'] && has(input.order.promise_hours_remaining) && input.order.promise_hours_remaining < 24.0 && input.order.hours_in_state >= 24.0"
    then: 3
    reason: unshipped_promise_due_within_a_day
    priority: 30
  - id: node_breach_likely
    when: "input.order.state in ['created', 'validated', 'sourcing', 'released', 'on_hold'] && has(input.node.breach_probability) && input.node.breach_probability >= 0.7"
    then: 3
    reason: node_backlog_breach_likely
    priority: 40
state:
  include:
    - order.state
    - order.order_type
    - order.hours_in_state
    - order.promise_hours_remaining
    - order.ship_method
    - order.carrier_exception
    - node.type
    - node.backlog_units
    - node.reject_rate
    - node.staffing
    - node.minutes_to_cutoff
    - node.breach_probability
    - carrier.on_time_rate_7d
questions:
  breach_risk:
    type: score
    instructions: How likely is this order to miss its delivery promise? Use the node's learned backlog breach probability when given.
    feeds: proactive_repromise
    criteria:
      - Very unlikely to breach, well ahead of promise with a healthy node and carrier
      - Unlikely to breach, on track with minor slack
      - Even chance, slack is thin or the node is backlogged
      - Likely to breach, already late in state, store understaffed or carrier degraded
      - Almost certain to breach, past cutoff or stuck with no movement
bands:
  act: { confidence_gte: 0.8 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
