# Address risk (FR-CAP-05). Noul, tier T2: undeliverable or reshipper address; act only >= 0.9. Freight forwarders
# matter for a fashion brand because limited drops are bought for resale abroad. GR-16: delivery attributes only; ZIP
# is used for deliverability, never as a demographic proxy.
decision: address_risk
version: 1
owner: returns-and-fit
tier: T2
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: false
state:
  include:
    - address.verification_status
    - address.type
    - address.unit_present
    - address.po_box
    - address.freight_forwarder_match
    - address.prior_failed_deliveries
    - order.total
    - order.ship_method
    - order.has_drop_lines
questions:
  risky_address:
    type: noul
    statement: This address is likely undeliverable or belongs to a reshipper or freight forwarder.
    feeds: address_hold
    criteria:
      "true": Verification failed, forwarder match, prior failed deliveries or a commercial mail drop receiving a limited drop
      "false": A verified residential or business address with normal history
bands:
  act: { confidence_gte: 0.9 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
