# Node on-time likelihood (FR-DEC-04/05). Score per candidate node, composite-weighted with cost efficiency, two-stage
# top-K. Tier T1. Store candidates carry thin staffing on Saturdays and a higher reject rate than the DC; the 3PL is
# cheap for the west coast but short-picks. Input: candidates[] (one map per node).
decision: sourcing_node_score
version: 2
owner: fulfilment-ops
tier: T1
provider: jev
fallbackProvider: heuristic
timeoutMs: 3000
default: rank_by_distance
state:
  include:
    - order.destination_state
    - order.ship_method
    - order.line_count
    - order.sku_class
    - order.day_part
    - candidates[].id
    - candidates[].type
    - candidates[].backlog_units
    - candidates[].reject_rate
    - candidates[].staffing
    - candidates[].minutes_to_cutoff
    - candidates[].distance_km
    - candidates[].cost_usd
    - candidates[].on_time_rate
    - candidates[].breach_probability
questions:
  on_time:
    type: score
    instructions: Can this node ship this order on time given its backlog, reject rate, staffing and cutoff, and its observed on-time rate and backlog breach probability when given?
    feeds: sourcing_composite
    criteria:
      - Very unlikely to ship on time, backlog far beyond capacity or already past cutoff
      - Unlikely to ship on time, heavy backlog or a store with thin staffing on a busy day
      - Even chance, moderate backlog and normal staffing
      - Likely to ship on time, light backlog and healthy staffing well before cutoff
      - Almost certain to ship on time, idle capacity and the parcel leaves today
  cost_efficiency:
    type: score
    instructions: How cost efficient is shipping this order from this node?
    feeds: sourcing_composite
    criteria:
      - Very expensive, cross-country from a store with high handling cost
      - Expensive, above the network average for this destination
      - Average cost for this destination
      - Cheap, nearby warehouse with standard handling
      - Cheapest option available in the network
composite:
  weights:
    on_time: 0.65
    cost_efficiency: 0.35
  outputKey: node_score
topK:
  scoreQuestion: on_time
  k: 10
  candidatesField: candidates
bands:
  act: { confidence_gte: 0.8 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
