# Order types (FR-CAP-03). Each binds a header + line state model, a workflow and the decision set it may invoke.
orderTypes:
  - name: standard_ship
    description: Ship-to-home from any node
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, sourcing_node_score, split_acceptability, sla_breach_risk, exception_classify, address_risk]
    channelDefaults:
      web: ship_as_available
      marketplace: ship_complete
      pos: ship_complete
      agent: ship_complete
      b2b: ship_complete
    returnWindowDays: 30
  - name: bopis
    description: Buy online, pick up in store
    headerStateModel: order.bopis
    lineStateModel: order_line.bopis
    workflowType: order.bopis
    decisions: [sla_breach_risk, exception_classify]
    channelDefaults: { web: pickup_consolidated, agent: pickup_consolidated }
    returnWindowDays: 30
  - name: ship_from_store
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, sourcing_node_score, sla_breach_risk, exception_classify]
    sourcing: { nodeTypes: [store] }
    returnWindowDays: 30
  - name: same_day_local
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [sourcing_node_score, sla_breach_risk, exception_classify]
    sourcing: { capabilities: [same_day], maxDistanceKm: 40 }
    returnWindowDays: 14
  - name: drop_ship
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [sla_breach_risk, exception_classify]
    sourcing: { nodeTypes: [vendor] }
    returnWindowDays: 30
  - name: pre_order
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [fulfilment_intent, sourcing_node_score, backorder_next_action]
    sourcing: { allowBackorder: true, includeInbound: true }
    returnWindowDays: 30
  - name: backorder
    headerStateModel: order.standard_ship
    lineStateModel: order_line.standard_ship
    workflowType: order.standard_ship
    decisions: [backorder_next_action, sourcing_node_score]
    sourcing: { allowBackorder: true }
    returnWindowDays: 30
