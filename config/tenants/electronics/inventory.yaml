# Voltline Electronics — initial supply positions, loaded through POST /api/v1/inventory/feed (the multi-tenant seeder
# and scripts/new-tenant.sh both use this file). Replace with your WMS feed: POST /webhooks/inventory/{nodeId} keeps
# positions current. supplyType: on_hand | po | asn | in_transit; only on_hand counts in ATP while
# inventory.include_inbound is false, so ASN/PO rows are ETAs for promises and backorder decisions, not sellable stock.
#
# Scenario positions:
#   * PHN-NOVA-X2-256 (launch pre-order): 10 units on hand at DC-MEM = wave 1; 350 on ASN = wave 2 (E1).
#   * LAP-AERO-14: sold out everywhere, 60 on PO at DC-MEM = the backorder with an ETA (E3).
#   * TVs and monitors live at the vendor (drop_ship sources nodeTypes [vendor]); TV-LED-43 and MON-4K-27 are also
#     stocked in the DCs so a standard_ship TV order and a vendor_repromise re-source have somewhere to go (E5).
#   * Certified-refurbished SKUs are stocked only at RFB-LOU. Loose battery packs never sit in stores (no hazmat cert).
