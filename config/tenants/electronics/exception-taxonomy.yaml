# Voltline Electronics — exception taxonomy (FR-MON-03). The decision `exception_classify` maps raw signals onto `type`
# (its options mirror this list); this file adds severity, owning queue, playbook and SLA. Queues are created here
# (PUT /api/v1/queues/{name}); every queue referenced by a playbook, SLA, decision escalation or the returns module
# (returns_ops) exists below.
exceptionTypes:
  - { type: address,             severity: medium,   queue: cs_exceptions,          playbook: address_fix,          slaMinutes: 240,  description: Address undeliverable, failed verification, or PO box for a lithium / oversized item }
  - { type: inventory_short,     severity: high,     queue: ops_exceptions,         playbook: resource,             slaMinutes: 120,  description: Short pick, serial not found, oversell or no feasible node }
  - { type: carrier_delay,       severity: medium,   queue: ops_exceptions,         playbook: repromise,            slaMinutes: 480,  description: Carrier scan shows delay, lost or late without damage }
  - { type: carrier_damage,      severity: high,     queue: cs_exceptions,          playbook: carrier_damage_claim, slaMinutes: 240,  description: Parcel or freight damaged in transit (carrier exception or customer photos) }
  - { type: payment,             severity: high,     queue: finance_exceptions,     playbook: payment_retry,        slaMinutes: 120,  description: Authorisation declined, expired, capture failed or chargeback notice }
  - { type: store_reject,        severity: high,     queue: ops_exceptions,         playbook: resource,             slaMinutes: 60,   description: Store rejected or timed out on a release }
  - { type: vendor_sla_breach,   severity: high,     queue: vendor_ops,             playbook: vendor_repromise,     slaMinutes: 240,  description: Drop-ship vendor missed the 48 h ship SLA or pushed its ship date }
  - { type: allocation_shortfall, severity: medium,  queue: launch_desk,            playbook: launch_allocation,    slaMinutes: 240,  description: Pre-order could not be allocated by rule in the current wave }
  - { type: high_value_address,  severity: high,     queue: risk_review,            playbook: high_value_review,    slaMinutes: 120,  description: High-value order to a risky, forwarder or reshipper address }
  - { type: warranty_rtv,        severity: low,      queue: vendor_ops,             playbook: rtv_claim,            slaMinutes: 2880, description: Bench confirmed a vendor defect; RTV claim to raise }
  - { type: system,              severity: critical, queue: platform_oncall,        playbook: notify_oncall,        slaMinutes: 30,   description: Integration or workflow failure }
  - { type: stuck,               severity: medium,   queue: ops_exceptions,         playbook: diagnose_stuck,       slaMinutes: 240,  description: Missing an expected event within the window }
  - { type: sla_breach,          severity: medium,   queue: ops_exceptions,         playbook: store_backlog,        slaMinutes: 120,  description: State SLA breached }
  - { type: margin_floor,        severity: high,     queue: margin_floor_approvals, playbook: margin_review,        slaMinutes: 120,  description: Plan below the 8 % profitability floor }
  - { type: agent_verification,  severity: high,     queue: risk_review,            playbook: agent_review,         slaMinutes: 60,   description: Agent order outside mandate or unverified agent }
  - { type: return_not_received, severity: low,      queue: cs_exceptions,          playbook: return_not_received,  slaMinutes: 1440, description: RMA approved but no carrier scan }
  - { type: other,               severity: low,      queue: ops_exceptions,         playbook: manual_review,        slaMinutes: 480,  description: Unclassified }
queues:
  - { name: ops_exceptions,         slaMinutes: 240,  escalateTo: ops_lead,           skills: [ops],               description: Fulfilment exceptions across DCs and stores }
  - { name: cs_exceptions,          slaMinutes: 240,  escalateTo: cs_lead,            skills: [cs],                description: Customer-facing fixes (address, damage, substitutes) }
  - { name: finance_exceptions,     slaMinutes: 240,  escalateTo: finance_controller, skills: [finance],           description: Payment and capture problems }
  - { name: margin_floor_approvals, slaMinutes: 120,  escalateTo: finance_controller, skills: [finance, strategy], description: Plans below the margin floor }
  - { name: risk_review,            slaMinutes: 60,   escalateTo: risk_lead,          skills: [risk],              description: Address risk, reshippers, agent verification }
  - { name: vendor_ops,             slaMinutes: 240,  escalateTo: vendor_manager,     skills: [vendor, ops],       description: Drop-ship vendor SLA and RTV claims }
  - { name: launch_desk,            slaMinutes: 120,  escalateTo: merchandising_lead, skills: [merchandising, cs], description: Pre-order allocation calls the rules could not make }
  - { name: returns_ops,            slaMinutes: 480,  escalateTo: returns_lead,       skills: [returns, bench],    description: Disposition tasks the bench must decide by hand }
  - { name: platform_oncall,        slaMinutes: 30,   escalateTo: platform_lead,      skills: [platform] }
  - { name: decision_escalations,   slaMinutes: 120,  escalateTo: ops_lead,           skills: [ops],               description: L3 escalations from any decision }
  - { name: refund_approvals,       slaMinutes: 240,  escalateTo: finance_controller, skills: [finance],           description: Refunds above $1,000 or while the breaker is open }
  - { name: unclassified,           slaMinutes: 480,  escalateTo: ops_lead,           skills: [] }
