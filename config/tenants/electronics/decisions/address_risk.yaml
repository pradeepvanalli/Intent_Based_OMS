# Address risk (FR-CAP-05). Noul, tier T2: undeliverable or reshipper address; act only >= 0.9. This is the generic
# deliverability flag used on every order; high_value_address_risk adds the score used for orders above $500.
# GR-16: the state carries delivery attributes only; ZIP is used for deliverability, not as a demographic proxy.
decision: address_risk
version: 1
owner: returns-and-risk
tier: T2
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: false
state:
  include:
    - address.verification_status
    - address.type
    - address.unit_present
    - address.po_box
    - address.freight_forwarder_match
    - address.prior_failed_deliveries
    - order.total
    - order.ship_method
questions:
  risky_address:
    type: noul
    statement: This address is likely undeliverable or belongs to a reshipper or freight forwarder.
    feeds: address_hold
    criteria:
      "true": Verification failed, forwarder or reshipper match, prior failed deliveries, a PO box for a carrier that cannot deliver there, or a commercial mail drop
      "false": A verified residential or business address with normal delivery history
bands:
  act: { confidence_gte: 0.9 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
