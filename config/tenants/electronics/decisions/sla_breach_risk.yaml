# SLA breach risk (FR-MON-02). Score 0-4 per open order, tier T1; feeds proactive re-promise. For drop-ship orders the
# "node" is the vendor: its backlog and hours since release are the main signals for the 48 h vendor ship SLA.
decision: sla_breach_risk
version: 1
owner: control-tower
tier: T1
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: 1
state:
  include:
    - order.state
    - order.order_type
    - order.hours_in_state
    - order.promise_hours_remaining
    - order.ship_method
    - node.type
    - node.backlog_units
    - node.reject_rate
    - node.minutes_to_cutoff
    - carrier.on_time_rate_7d
questions:
  breach_risk:
    type: score
    instructions: How likely is this order to miss its delivery promise?
    feeds: proactive_repromise
    criteria:
      - Very unlikely to breach, well ahead of promise with a healthy node and carrier
      - Unlikely to breach, on track with minor slack
      - Even chance, slack is thin or the node or vendor is backlogged
      - Likely to breach, already late in state, vendor past half its ship SLA or carrier degraded
      - Almost certain to breach, past cutoff, vendor SLA already exceeded or stuck with no movement
bands:
  act: { confidence_gte: 0.8 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
