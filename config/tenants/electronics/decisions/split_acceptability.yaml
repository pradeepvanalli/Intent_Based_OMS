# Split acceptability. Noul, tier T2: act only >= 0.9 (confidence |2p-1|), else a person decides. Never asked for
# bundle_ship_complete orders (the type does not list it); for everything else the model weighs the stated intent,
# history and whether the second box would be an accessory for a device in the first.
decision: split_acceptability
version: 2
owner: omnichannel-strategy
tier: T2
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: false
state:
  include:
    - order.channel
    - order.notes
    - order.intent
    - customer.tier
    - customer.history.split_acceptance_rate
    - customer.history.split_complaints
    - customer.facts.split_tolerance
    - customer.facts.speed_vs_cost
    - customer.facts.pickup_preference
    - customer.facts.preferred_contact_channel
    - customer.facts.segment
    - plan_options[].packages
    - plan_options[].eta
    - plan_options[].cost_delta
questions:
  split_ok:
    type: noul
    statement: This customer would accept receiving the order in more than one package, given the stated intent and history.
    feeds: split_vs_hold
    criteria:
      "true": The customer accepts separate shipments and the split does not separate a device from its only charger or case
      "false": The customer wants a single delivery, has complained about splits, or the order is a device plus its accessories
bands:
  act: { confidence_gte: 0.9 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
postChecks:
  - "!has(chosen_plan.margin) || chosen_plan.margin >= tenant.margin_floor"
