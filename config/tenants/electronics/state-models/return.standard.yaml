# Warranty RMA lifecycle (FR-RET-01..05). Eligibility (return_risk, T2) → label → receipt at the refurbishment centre
# → inspection → disposition → refund or keep-it. Warranty triage happens between receipt and disposition: the
# inspector records the condition and a diagnostic note, `warranty_triage` (T1) classifies defective / buyer_remorse /
# transit_damage, and `return_disposition` (T1) turns that into refurbish / return_to_vendor / destroy / restock. Both
# decisions run inside `received → inspected` (the inspection event carries the note), so the statechart needs no extra
# states; a transit-damage finding also opens a carrier claim through the carrier_damage exception type.
stateModel: return.standard
version: 1
entity: return
quantityLevel: false
states:
  - { id: requested, meta: Created }
  - { id: approved }
  - { id: awaiting_receipt, sla: { maxAge: P14D, onBreach: playbook.return_not_received } }
  - { id: received }
  - { id: inspected }
  - { id: refunded, meta: Terminal }
  - { id: rejected, meta: Terminal }
  - { id: cancelled, meta: Terminal }
  - { id: keep_it_refunded, meta: Terminal }
transitions:
  - from: requested
    to: rejected
    trigger: decision.return_eligibility
    guards: ["decision.value == 'reject'"]
    actions: [notify_customer_rejected]
  - from: requested
    to: keep_it_refunded
    trigger: decision.return_eligibility
    guards: ["decision.value == 'keep_it'"]
    actions: [issue_refund, notify_customer_keep_it]
  - from: requested
    to: approved
    trigger: decision.return_eligibility
    guards: ["decision.value != 'reject' && decision.value != 'escalate' || approval.present"]
    actions: [issue_return_label]
  - from: approved
    to: awaiting_receipt
    trigger: event.label_issued
  - from: approved
    to: keep_it_refunded
    trigger: decision.keep_it
    guards: ["decision.value == 'keep_it'"]
    actions: [issue_refund, notify_customer_keep_it]
  - from: awaiting_receipt
    to: received
    trigger: event.received
  - from: awaiting_receipt
    to: refunded
    trigger: event.refund_issued
    # the refund-timing decision outcome is passed by the returns module as ctx.refund_timing (CEL reserves the word "return")
    guards: ["ctx.refund_timing == 'instant' || ctx.refund_timing == 'on_carrier_scan'"]
  - from: received
    to: inspected
    trigger: event.inspected
    actions: [run_disposition]
  - from: received
    to: refunded
    trigger: event.refund_issued
  - from: inspected
    to: refunded
    trigger: event.refund_issued
  - from: inspected
    to: rejected
    trigger: api.reject_return
    permission: return.decide
    actions: [notify_customer_rejected]
  - from: [requested, approved, awaiting_receipt]
    to: cancelled
    trigger: api.cancel_return
    permission: return.decide
