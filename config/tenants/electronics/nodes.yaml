# Voltline Electronics — fulfilment network (FR-SRC-01). Health signals feed sourcing_node_score; costProfile feeds
# the order P&L. Two DCs, four ship-from-store locations, one drop-ship vendor (monitors and TVs) and one
# refurbishment centre that stocks certified-refurbished SKUs and receives warranty RMAs. Node ids are stable: WMS
# webhooks address nodes by id (/webhooks/wms/{nodeId}).
nodes:
  - id: DC-MEM
    name: Memphis TN distribution centre
    type: dc
    lat: 35.0456
    lon: -89.9823
    country: US
    state: TN
    zip: "38118"
    capabilities: [ship, hazmat]              # hazmat: certified to ship loose lithium packs (UN3480) by ground
    dailyCapacity: 14000
    cutoff: "18:00"                            # late cutoff next to the air hub; ground only for batteries
    timezone: America/Chicago
    health: { backlog: 900, pick_rate: 0.97, reject_rate: 0.003, staffing: 0.94 }
    costProfile: { labour_per_unit: 1.35, packaging: 1.10, handling: 0.55 }   # serial scan + tamper seal per unit
