# Voltline Electronics — data-driven sample orders (format: docs/SAMPLE_ORDERS_FORMAT.md). The seeder captures these
# through the normal capture pipeline, drives the requested lifecycle through the mock WMS / carrier webhooks, then
# creates the listed returns and exceptions. Keys are stable; channelOrderId is unique; every SKU is in catalog.yaml,
# every order type in order-types.yaml. Serial numbers and IMEIs travel as order extensions keyed by line id
# (extension-schema.json): the platform validates extensions at order level, so there is no line-level schema.
#
# Scenario map (README): E1 launch pre-orders L01-L12 · E2 forwarder laptop H01 · E3 backorders B01-B03 ·
# E4 returns on W01 / W02 / W03 · E5 drop-ship vendor SLA breach on V01 (exception X01). Also: lithium pack to a PO
# box (P01, compliance hold), bundle (K01), trade-in credit (T01), marketplace (M01), ship-from-store (S01, S02 with a
# store reject), declined card (D01), carrier damage (X02 on C01), refurbished (R01), gift cards (G01), oversized TV
# from a DC (O01), high-value phone with adult signature (A01).
