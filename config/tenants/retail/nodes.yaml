# Maple & Main General Store — fulfilment network (PRD section 10 "Node", FR-SRC-01/08).
# Two regional DCs (hazmat-certified), six stores (pickup, curbside, ship-from-store, same-day where the city allows)
# and one drop-ship furniture vendor. `health` feeds sourcing_node_score; `costProfile` feeds plan economics;
# `dailyCapacity` is the hard daily release cap the candidate generator enforces (units released since midnight UTC):
# the Denver store is deliberately small (60 units) so the holiday-surge batch in sample-orders.yaml overflows to a DC.
# Capabilities: ship, bopis (pickup), curbside (pickup variant; the `curbside` order type requires it), sfs (ship from
# store), hazmat (aerosols, flammables), same_day (local courier within 40 km).
nodes:
  - id: DC-COL
    name: Columbus OH distribution centre
    type: dc
    lat: 39.9612
    lon: -82.9988
    country: US
    state: OH
    zip: "43215"
    capabilities: [ship, hazmat]
    dailyCapacity: 18000
    cutoff: "17:00"
    timezone: America/New_York
    health: { backlog: 900, pick_rate: 0.97, reject_rate: 0.004, staffing: 0.94 }
    costProfile: { labour_per_unit: 1.10, packaging: 0.70, handling: 0.40 }
