# Maple & Main (retail reference tenant) — decision `split_acceptability`. Same shape as the starter with production evaluation gates
# (minAccuracyInActBand 0.90, maxCalibrationError 0.05). Review: owner, tier, bands, criteria wording, and add a
# golden set under golden-sets/ before publishing through the normal approval path (see README.md §4). fallbackProvider stays
# `heuristic` so the tenant works without AI keys; switch to `llm.structured` once an LLM key is configured.
# Split acceptability (PRD section 9). Noul, tier T2: act only >= 0.9 (confidence |2p-1|), else a person decides.
decision: split_acceptability
version: 2
owner: omnichannel-strategy
tier: T2
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: false
state:
  include:
    - order.channel
    - order.notes
    - order.intent
    - customer.tier
    - customer.history.split_acceptance_rate
    - customer.history.split_complaints
    - customer.facts.split_tolerance
    - customer.facts.speed_vs_cost
    - customer.facts.pickup_preference
    - customer.facts.preferred_contact_channel
    - customer.facts.segment
    - plan_options[].packages
    - plan_options[].eta
    - plan_options[].cost_delta
questions:
  split_ok:
    type: noul
    statement: This customer would accept receiving the order in more than one package, given the stated intent and history.
    feeds: split_vs_hold
    criteria:
      "true": The customer accepts separate shipments
      "false": The customer wants a single delivery or has complained about splits
bands:
  act: { confidence_gte: 0.9 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
postChecks:
  - "!has(chosen_plan.margin) || chosen_plan.margin >= tenant.margin_floor"
