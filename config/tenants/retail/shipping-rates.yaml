# Maple & Main — negotiated parcel rate card (aggregator-style). zone = distance band in km; cost by weight band (kg);
# transitDays nominal. Oversized items (grills, rugs, furniture) land in the 999 band, which is what makes a 14 kg fire
# pit to Hawaii breach the margin floor (scenario R3). `pickup` is free and zero-day by construction in the planner.
