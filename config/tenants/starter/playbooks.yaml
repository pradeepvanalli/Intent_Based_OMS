# Starter tenant. Every `action` needs a registered handler (GET /api/v1/playbooks/-/actions). `spendLimits` are
# loaded by the seeder only; through the API they are not settable yet.
# Playbooks (FR-MON-04): configured remediation steps gated by decision confidence and spend limits.
playbooks:
  - name: resource
    description: Re-source the affected lines to the next best node and penalise the rejecting node
    steps:
      - { action: resource, minConfidence: 0.0 }
      - { action: notify, channel: slack, template: resourced }
  - name: repromise
    description: Recompute promise and tell the customer when on-time probability drops
    steps:
      - { action: repromise, minConfidence: 0.5 }
      - { action: contact_customer, template: delay_notice, requiresDecision: sla_breach_risk, minConfidence: 0.8 }
  - name: address_fix
    steps:
      - { action: hold, holdType: address, blocks: [release] }
      - { action: contact_customer, template: address_confirm }
      - { action: create_task, queue: cs_exceptions }
  - name: payment_retry
    steps:
      - { action: reauthorize }
      - { action: hold, holdType: payment, blocks: [release], onFailure: true }
      - { action: create_task, queue: finance_exceptions, onFailure: true }
  - name: notify_oncall
    steps:
      - { action: notify, channel: pagerduty }
      - { action: create_task, queue: platform_oncall }
  - name: diagnose_stuck
    steps:
      - { action: classify }
      - { action: retry_workflow }
      - { action: create_task, queue: ops_exceptions, onFailure: true }
  - name: store_backlog
    steps:
      - { action: notify, channel: slack, template: store_backlog }
      - { action: resource, minConfidence: 0.8, when: "exception.age_minutes > 240" }
  - name: margin_review
    steps:
      - { action: create_task, queue: margin_floor_approvals }
  - name: agent_review
    steps:
      - { action: hold, holdType: agent_verification, blocks: [release] }
      - { action: create_task, queue: risk_review }
  - name: return_not_received
    steps:
      - { action: contact_customer, template: return_reminder }
      - { action: create_task, queue: cs_exceptions, when: "exception.age_minutes > 10080" }
  - name: pickup_reminder
    steps:
      - { action: contact_customer, template: pickup_reminder }
  - name: manual_review
    steps:
      - { action: create_task, queue: ops_exceptions }
spendLimits:
  reship_usd: 150
  refund_usd: 100
  appeasement_usd: 25
