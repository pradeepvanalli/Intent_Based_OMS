    capabilities: [ship, hazmat]
    dailyCapacity: 8000
    cutoff: "16:00"
    timezone: America/Los_Angeles
    health: { backlog: 0, pick_rate: 0.97, reject_rate: 0.005, staffing: 1.0 }
    costProfile: { labour_per_unit: 1.20, packaging: 0.65, handling: 0.40 }
  - id: STORE-001
