# Starter tenant — fulfilment network: two distribution centres and two stores as placeholders. Replace ids, names,
# coordinates (used for distance and transit), cutoffs and capacities with your own. `health` feeds the
# sourcing_node_score decision and is updated live through POST /api/v1/nodes/{id}/health; `costProfile` feeds the
# plan economics. Capabilities: ship, bopis (pickup), sfs (ship from store), hazmat, same_day.
nodes:
  - id: DC-EAST
    name: East distribution centre (placeholder)
    type: dc
    lat: 40.0583           # New Jersey; replace
    lon: -74.4057
    country: US
    state: NJ
    zip: "08837"
    capabilities: [ship, hazmat]
    dailyCapacity: 10000
    cutoff: "17:00"
    timezone: America/New_York
    health: { backlog: 0, pick_rate: 0.97, reject_rate: 0.005, staffing: 1.0 }
    costProfile: { labour_per_unit: 1.10, packaging: 0.65, handling: 0.40 }
  - id: DC-WEST
    name: West distribution centre (placeholder)
    type: dc
    lat: 39.5296           # Nevada; replace
    lon: -119.8138
    country: US
    state: NV
