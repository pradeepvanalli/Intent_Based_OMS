# Pre-capture payment-fraud risk (SOO requirements doc FD-01). Noul, tier T2 like its sibling risk decisions
# (address_risk, return_risk): act only >= 0.9, since a false "high risk" blocks a real, good order.
# Invoked by the order workflow before tenders are authorised (orchestration PaymentRiskGate). A "high risk" answer,
# or a hand-off to a person, places a payment_review hold that blocks release and capture; nothing is cancelled.
# GR-16: state carries fraud signals only, no protected attributes, no card numbers or addresses (the address is a
# token). Velocity = additional distinct cards the same customer used in the window; linkage counts = other customers
# sharing this order's address / device / card in 30 days. agent.reputation_score, agent.dispute_rate and
# payment.address_reuse_count are learned facts merged in by the learning layer, only once promoted for live use.
# The act-band threshold is tuned by the FraudThresholdTuner learner (FD-03) as reviewable ThresholdChange proposals.
# v2: clean-order L0 rule (no signal, no model call, no task) and the learned-fact inputs. token_customer_count (other
# customers on the same card) is left to the model rather than the rule because sandbox and gateway test tokens are
# shared by every customer; a tenant on real card fingerprints can add "&& input.payment.token_customer_count <= 1".
decision: payment_risk
version: 2
owner: returns-and-risk
tier: T2
provider: jev
fallbackProvider: heuristic
timeoutMs: 800
default: false
rules:
  - id: no_risk_signals
    when: "input.payment.velocity_1h <= 1 && input.payment.velocity_24h <= 2 && input.payment.address_linkage_count <= 2 && input.payment.device_linkage_count <= 1 && input.payment.billing_shipping_mismatch == false && (!has(input.agent.reputation_score) || input.agent.reputation_score >= 0.5) && (!has(input.agent.dispute_rate) || input.agent.dispute_rate < 0.1) && (!has(input.payment.address_reuse_count) || input.payment.address_reuse_count < 3)"
    then: false
    reason: no_risk_signals
    priority: 50
state:
  include:
    - payment.velocity_1h
    - payment.velocity_24h
    - payment.address_linkage_count
    - payment.device_linkage_count
    - payment.token_customer_count
    - payment.billing_shipping_mismatch
    - payment.address_reuse_count
    - agent.mandate_present
    - agent.reputation_score
    - agent.dispute_rate
    - order.total
    - order.channel
questions:
  high_risk_payment:
    type: noul
    statement: This payment is likely fraudulent and should be held before capture.
    feeds: payment_hold
    criteria:
      "true": High velocity across cards/addresses/devices, billing/shipping mismatch, an address shared by many customers, or a low-reputation agent mandate order
      "false": Normal velocity, consistent billing and shipping, no linkage signals
bands:
  act: { confidence_gte: 0.9 }
  confirm: { confidence_gte: 0.5 }
  escalate: { otherwise: true }
